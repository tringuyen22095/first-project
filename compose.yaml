# Full-stack Docker Compose file — hot-deploy development mode (Tomcat + WAR).
#
# PRE-REQUISITE: build the WAR at least once before starting:
#   mvn package -DskipTests
#
# Usage:
#   docker compose -f compose.yaml up --build        # first run (builds dev image)
#   docker compose -f compose.yaml up app            # start/check only the app (infra stays untouched)
#   docker compose -f compose.yaml restart app       # force-restart the app container
#   docker compose -f compose.yaml down              # stop containers, keep DB data
#   docker compose -f compose.yaml down -v           # stop + wipe DB volume (full reset)
#
# Hot-deploy workflow (after first run):
#   1. mvn package -DskipTests  →  target/ROOT.war is updated on host
#   2. The mounted volume propagates ROOT.war into /usr/local/tomcat/webapps/ automatically
#   3. Tomcat's autoDeploy detects the changed WAR and redeploys (~10s) — no docker command needed
#
# For local development without Docker (mvn spring-boot:run), use compose.yaml instead —
# it starts only postgres and redis, and Spring Boot manages it automatically.

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=monolithic'
      - 'POSTGRES_PASSWORD=admin'
      - 'POSTGRES_USER=sa'
    ports:
      - '5432:5432'
    volumes:
      - './src/main/resources/db/init:/docker-entrypoint-initdb.d'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sa -d monolithic" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '81:8080'    # Tomcat HTTP port (8080) exposed as 81 on host
      - '5005:5005'  # JDWP remote-debug port
    volumes:
      # Mount the host's target/ directory into Tomcat's webapps directory.
      # When mvn package -DskipTests produces target/ROOT.war, Tomcat's
      # autoDeploy detects the updated WAR and redeploys automatically (~10s).
      # No docker command or container restart needed.
      - ./target:/usr/local/tomcat/webapps
    environment:
      # Override datasource — inside Docker the hostname is the service name, not localhost
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/monolithic'
      - 'SPRING_DATASOURCE_USERNAME=nene'
      - 'SPRING_DATASOURCE_PASSWORD=475963218'

      # Override Flyway datasource for the dedicated DDL user
      - 'SPRING_FLYWAY_URL=jdbc:postgresql://postgres:5432/monolithic'
      - 'SPRING_FLYWAY_USER=flyway'
      - 'SPRING_FLYWAY_PASSWORD=flyway_admin'

      # Override Redis properties
      - 'SPRING_DATA_REDIS_HOST=redis'
      - 'SPRING_DATA_REDIS_PORT=6379'
      # Enable JDWP remote debugging.
      # suspend=n  → the JVM starts immediately without waiting for a debugger
      # address=*:5005 → listen on all interfaces inside the container
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
