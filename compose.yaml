services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=monolithic'
      - 'POSTGRES_PASSWORD=admin'
      - 'POSTGRES_USER=sa'
    ports:
      - '5432:5432'
    volumes:
      - './src/main/resources/db/init:/docker-entrypoint-initdb.d'
  redis:
    image: 'redis:latest'
    ports:
      - '6379'
